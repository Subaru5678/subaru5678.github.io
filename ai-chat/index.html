<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>マルチAIチャット</title>
<style>
  :root{ --bg:#f7f5f4; --card:#fff; --ink:#221c1a; --mute:#7a706b; --line:#e4dfdc; --accent:#3f6fc9; }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#16140f; --card:#211e19; --ink:#efe9e4; --mute:#a39a93; --line:#37322c; --accent:#7ea2ec; }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; height:100vh; height:100dvh; display:flex; flex-direction:column; max-width:760px; margin:0 auto;
    font:15px/1.6 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header{ display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1{ font-size:16px; margin:0; flex:1; }
  button{ font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:8px; padding:6px 12px; }
  button.primary{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  button:disabled{ opacity:.5; cursor:default; }
  #settings{ display:none; padding:10px 16px; border-bottom:1px solid var(--line); gap:8px; }
  #settings.open{ display:grid; }
  .row{ display:grid; grid-template-columns:110px 1fr 1fr; gap:6px; align-items:center; }
  .row label{ font-weight:700; display:flex; gap:6px; align-items:center; }
  .row input[type=text],.row input[type=password]{ width:100%; font:inherit; font-size:13px; padding:5px 8px;
    border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  .opt{ font-size:13px; color:var(--mute); display:flex; gap:6px; align-items:center; }
  #log{ flex:1; min-height:0; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .m{ max-width:88%; }
  .m .who{ font-size:12px; font-weight:700; margin:0 4px 2px; color:var(--mute); }
  .m .b{ white-space:pre-wrap; word-break:break-word; padding:8px 12px; border-radius:12px;
    background:var(--card); border:1px solid var(--line); }
  .m.user{ align-self:flex-end; } .m.user .who{ text-align:right; }
  .m.user .b{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .m.err .b{ color:#c0392b; } .m.wait .b{ color:var(--mute); }
  .c-gemini .who{ color:#6a5acd; } .c-groq .who{ color:#e0702b; } .c-openrouter .who{ color:#2f8f6b; }
  .b p{ margin:0 0 .6em; } .b p:last-child{ margin:0; }
  .b pre{ margin:.5em 0; padding:8px 10px; background:var(--bg); border:1px solid var(--line); border-radius:8px; overflow-x:auto; white-space:pre; }
  .b code{ font:12.5px/1.5 ui-monospace,Menlo,monospace; background:var(--bg); padding:1px 4px; border-radius:4px; }
  .b pre code{ background:none; padding:0; }
  .b ul,.b ol{ margin:.3em 0 .6em; padding-left:1.4em; }
  .b h3,.b h4{ margin:.6em 0 .3em; font-size:1em; }
  .sys{ align-self:center; font-size:12px; color:var(--mute); }
  .m .tools{ margin:2px 4px 0; font-size:11px; }
  .m .tools button{ padding:0 6px; font-size:11px; border-radius:5px; color:var(--mute); }
  form{ display:flex; gap:8px; padding:10px 16px 6px; }
  textarea{ flex:1; font:inherit; resize:none; height:56px; max-height:200px; padding:8px 10px; border:1px solid var(--line);
    border-radius:10px; background:var(--card); color:var(--ink); }
  .note{ font-size:12px; color:var(--mute); padding:0 16px 10px; }
  @media (max-width:560px){ .row{ grid-template-columns:1fr 1fr; } .row label{ grid-column:1/-1; } }
</style>
</head>
<body>
<header>
  <h1>マルチAIグループチャット</h1>
  <button id="gear" type="button">設定</button>
  <button id="save" type="button">保存</button>
  <button id="clear" type="button">リセット</button>
</header>
<div id="settings"></div>
<div id="log"></div>
<form id="form">
  <textarea id="q" placeholder="グループに送信（Enterで送信 / Shift+Enterで改行）"></textarea>
  <button class="primary" id="send">送信</button>
</form>
<div class="note">APIキーはこのブラウザのlocalStorageにのみ保存され、各社のAPIへ直接送信されます。AIは互いの発言も読めます。無料枠には回数制限があり、OpenRouterの無料モデルは入れ替わるので、エラー時はモデル名を変更してください。</div>

<script>
const $ = s => document.querySelector(s);
const asJson = async r => {
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error?.message || j[0]?.error?.message || JSON.stringify(j) || r.statusText), { status:r.status });
  return j;
};

// エラーの原因を日本語で説明する
function explain(e, p){
  const m = (e.message || '').toLowerCase(), st = e.status;
  if (e instanceof TypeError || m.includes('failed to fetch') || m.includes('networkerror'))
    return 'サーバーに接続できませんでした。ネット接続、広告ブロッカー/VPN/社内ネットワークによる遮断を確認してください。';
  if (st === 400 && (m.includes('api key') || m.includes('api_key'))) return 'APIキーが正しくありません。コピー漏れや余計な空白がないか確認してください。';
  if (st === 400 && (m.includes('model') || m.includes('not found'))) return 'モデル名が正しくないか、使えないモデルです。設定でモデル名を変更してください。';
  if (st === 400) return 'リクエストが不正です。モデル名や会話内容を確認してください。';
  if (st === 401) return 'APIキーが無効です。キーを取り直して設定に貼り直してください。';
  if (st === 402) return 'クレジット不足です。無料モデル（:free が付くもの）に切り替えてください。';
  if (st === 403) return 'このキーでは使えません。キーの権限、地域制限、またはモデルの利用条件を確認してください。';
  if (st === 404) return 'モデル名が存在しません。設定でモデル名を確認してください（OpenRouterの無料モデルは入れ替わります）。';
  if (st === 413) return '会話が長すぎます。「リセット」してから送り直してください。';
  if (st === 429) return '無料枠の回数制限に達しました。しばらく待つか、他のAIを使ってください。';
  if (st >= 500) return `${p.name}側のサーバーエラーです。時間をおいて再試行してください。`;
  if (m.includes('content') || m.includes('undefined') || m.includes('candidates')) return '返答が空でした（安全フィルタなどでブロックされた可能性）。質問を変えてみてください。';
  return '原因不明のエラーです。上のメッセージを確認してください。';
}

// 無料APIキーが取れるサービスのみ。msgs = [{role:'user'|'assistant', content}]
const openaiLike = (url, extra = {}) => (key, model, msgs) => fetch(url, {
  method:'POST',
  headers:{ 'content-type':'application/json', authorization:'Bearer ' + key, ...extra },
  body:JSON.stringify({ model, messages:msgs })
}).then(asJson).then(j => j.choices[0].message.content);

const PROVIDERS = [
  { id:'gemini', name:'Gemini', model:'gemini-2.5-flash', keyUrl:'https://aistudio.google.com/apikey',
    call:(key, model, msgs) => fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method:'POST',
      headers:{ 'content-type':'application/json', 'x-goog-api-key':key },
      body:JSON.stringify({ contents:msgs.map(m => ({ role:m.role === 'user' ? 'user' : 'model', parts:[{ text:m.content }] })) })
    }).then(asJson).then(j => j.candidates[0].content.parts.map(p => p.text || '').join('')) },
  { id:'groq', name:'Groq (Llama)', model:'llama-3.3-70b-versatile', keyUrl:'https://console.groq.com/keys',
    call:openaiLike('https://api.groq.com/openai/v1/chat/completions') },
  { id:'openrouter', name:'OpenRouter', model:'meta-llama/llama-3.3-70b-instruct:free', keyUrl:'https://openrouter.ai/keys',
    call:openaiLike('https://openrouter.ai/api/v1/chat/completions') },
];

const store = {
  get(k, d){ try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} },
};


const transcript = [];   // { who:'user'|providerId, text }
const byId = Object.fromEntries(PROVIDERS.map(p => [p.id, p]));

// 設定パネル
for (const p of PROVIDERS) {
  const row = document.createElement('div');
  row.className = 'row'; row.id = 'set-' + p.id;
  row.innerHTML = `<label><input type="checkbox" class="en"> <span>${p.name}<br><a href="${p.keyUrl}" target="_blank" rel="noopener" style="font-weight:400;font-size:11px">無料キー取得</a></span></label>
    <input type="password" class="key" placeholder="APIキー" autocomplete="off">
    <input type="text" class="model" placeholder="モデル名">`;
  $('#settings').append(row);
  const en = row.querySelector('.en'), key = row.querySelector('.key'), model = row.querySelector('.model');
  en.checked = store.get(p.id + '.on', '1') === '1';
  key.value = store.get(p.id + '.key', '');
  model.value = store.get(p.id + '.model', p.model);
  en.onchange = () => store.set(p.id + '.on', en.checked ? '1' : '0');
  key.onchange = () => store.set(p.id + '.key', key.value.trim());
  model.onchange = () => store.set(p.id + '.model', model.value.trim());
}
const seqBox = document.createElement('label');
seqBox.className = 'opt';
seqBox.innerHTML = '<input type="checkbox" id="seq"> 順番に返答する（前のAIの発言を読んでから次のAIが答える）';
$('#settings').append(seqBox);
const spareNote = document.createElement('div');
spareNote.className = 'opt';
spareNote.textContent = 'チェックを外したAIは「予備」: キーが入っていれば、オンのAIがエラーのときだけ代わりに答えます。';
$('#settings').append(spareNote);
$('#seq').checked = store.get('seq', '0') === '1';
$('#seq').onchange = e => store.set('seq', e.target.checked ? '1' : '0');
$('#gear').onclick = () => $('#settings').classList.toggle('open');
if (!PROVIDERS.some(p => store.get(p.id + '.key', ''))) $('#settings').classList.add('open');

const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// 簡易Markdown（先にHTMLをエスケープするので安全）
function md(src){
  const blocks = [];
  let t = esc(src).replace(/```[^\n]*\n([\s\S]*?)```/g, (_, c) => { blocks.push(c); return `\u0000${blocks.length - 1}\u0000`; });
  const inline = x => x.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = t.split(/\n{2,}/).map(par => {
    const m = par.match(/^\u0000(\d+)\u0000$/);
    if (m) return `<pre><code>${blocks[m[1]]}</code></pre>`;
    const lines = par.split('\n');
    if (lines.every(l => /^\s*[-*] /.test(l))) return '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*[-*] /,'')) + '</li>').join('') + '</ul>';
    if (lines.every(l => /^\s*\d+[.)] /.test(l))) return '<ol>' + lines.map(l => '<li>' + inline(l.replace(/^\s*\d+[.)] /,'')) + '</li>').join('') + '</ol>';
    const h = par.match(/^#{1,4} (.+)$/);
    if (h) return '<h4>' + inline(h[1]) + '</h4>';
    return '<p>' + inline(lines.join('<br>')) + '</p>';
  }).join('');
  return out.replace(/\u0000(\d+)\u0000/g, (_, i) => `<pre><code>${blocks[i]}</code></pre>`);
}

function bubble(cls, name, text, pid, raw){
  const d = document.createElement('div');
  d.className = 'm ' + cls + (pid ? ' c-' + pid : '');
  d.innerHTML = '<div class="who"></div><div class="b"></div>';
  d.querySelector('.who').textContent = name;
  setBody(d, text, raw);
  $('#log').append(d); $('#log').scrollTop = $('#log').scrollHeight;
  return d;
}
function setBody(d, text, raw){
  const b = d.querySelector('.b');
  if (raw) { b.innerHTML = md(text); d.querySelector('.tools')?.remove();
    const t = document.createElement('div'); t.className = 'tools';
    t.innerHTML = '<button type="button">コピー</button>';
    t.firstChild.onclick = () => { navigator.clipboard?.writeText(text); t.firstChild.textContent = 'コピーしました'; };
    d.append(t);
  } else b.textContent = text;
}
function note(text){
  const d = document.createElement('div'); d.className = 'sys'; d.textContent = text;
  $('#log').append(d); $('#log').scrollTop = $('#log').scrollHeight;
}

// 失敗したAIは少しの間お休み（回数制限の連打を避ける）
const COOL_MS = 60000, cooling = {};
const cool = id => Math.max(0, Math.ceil(((cooling[id] || 0) - Date.now()) / 1000));

// 会話の保存と復元
const save = () => store.set('transcript', JSON.stringify(transcript.slice(-60)));
try { for (const t of JSON.parse(store.get('transcript', '[]'))) {
  transcript.push(t);
  if (t.who === 'user') bubble('user', 'あなた', t.text);
  else if (byId[t.who]) bubble('', byId[t.who].name, t.text, t.who, true);
} } catch {}

// グループ全体の発言を、そのAI視点のmessages配列に直す（他AIの発言は「[名前] …」としてuser側に入れる）
function buildMsgs(p){
  const out = [];
  for (const t of transcript) {
    const role = t.who === p.id ? 'assistant' : 'user';
    const content = t.who === 'user' || t.who === p.id ? t.text : `[${byId[t.who].name}] ${t.text}`;
    if (out.length && out[out.length - 1].role === role) out[out.length - 1].content += '\n\n' + content;
    else out.push({ role, content });
  }
  return out;
}

const ready = q => { const r = $('#set-' + q.id); return !r.querySelector('.en').checked && r.querySelector('.key').value.trim() && !cool(q.id); };  // 予備＝オフでキーあり

// エラー時は、オフにしてある予備のAIが代わりに答える（さらに失敗すれば次の予備へ）
async function ask(p, failed = new Set(), forName = ''){
  const row = $('#set-' + p.id);
  if (!forName && !row.querySelector('.en').checked) return;
  const key = row.querySelector('.key').value.trim();
  const model = row.querySelector('.model').value.trim() || p.model;
  const label = forName ? `${p.name}（${forName}の代わり）` : p.name;
  if (!forName && key && cool(p.id)) { note(`${p.name} は一時休止中（あと${cool(p.id)}秒）`); return; }
  if (!key) { bubble('err', p.name, 'APIキーが未設定です（設定から入力）', p.id); return; }
  const el = bubble('wait', label, '考え中…', p.id);
  try {
    const out = await p.call(key, model, buildMsgs(p));
    transcript.push({ who:p.id, text:out });
    el.className = 'm c-' + p.id; setBody(el, out, true); save();
  } catch (e) {
    failed.add(p.id); cooling[p.id] = Date.now() + COOL_MS;
    const next = PROVIDERS.find(q => ready(q) && !failed.has(q.id));
    el.className = 'm err c-' + p.id;
    setBody(el, 'エラー' + (e.status ? ` (${e.status})` : '') + ': ' + e.message + '\n原因: ' + explain(e, p) + (next ? `\n→ ${next.name} に切り替えます` : ''));
    if (next) await ask(next, failed, forName || p.name);
  }
  $('#log').scrollTop = $('#log').scrollHeight;
}

$('#form').onsubmit = async e => {
  e.preventDefault();
  const text = $('#q').value.trim();
  if (!text) return;
  $('#q').value = ''; $('#send').disabled = true;
  transcript.push({ who:'user', text }); save();
  bubble('user', 'あなた', text);
  if ($('#seq').checked) for (const p of PROVIDERS) await ask(p);
  else await Promise.all(PROVIDERS.map(p => ask(p)));
  $('#send').disabled = false; $('#q').focus();
};
$('#q').onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#form').requestSubmit(); }
};
$('#q').oninput = e => { const q = e.target; q.style.height = '56px'; q.style.height = Math.min(q.scrollHeight, 200) + 'px'; };
$('#clear').onclick = () => { transcript.length = 0; $('#log').innerHTML = ''; save(); };
$('#save').onclick = () => {
  const txt = transcript.map(t => `【${t.who === 'user' ? 'あなた' : byId[t.who].name}】\n${t.text}`).join('\n\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type:'text/plain' }));
  a.download = 'ai-chat.txt'; a.click();
};
</script>
</body>
</html>
