<style>
  /* 抑えた配色の運用ログ画面。色は状態の変化(灰→琥珀→赤)にだけ使う */
  :root { color-scheme: dark; --bg:#0c0c0c; --panel:#0c0c0c; --line:#2b2b2b; --text:#c8c8c8; --dim:#767676;
    --bright:#f2f2f2; --warn:#c19c00; --err:#c50f1f; --ok:#13a10e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; color:var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK JP", "Hiragino Sans", monospace; }
  body { display:block; min-height:100vh; padding:0;
    background:var(--bg); transition: background 1.6s; overflow:hidden; }
  body.t3 { background:#0c0c0c; }
  body.t4 { background:#0c0c0c; }
  body.dark { background:#000 !important; transition:none; }
  body.dark #term { visibility:hidden; }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:5; opacity:0; transition:opacity 2s;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.8) 100%); }
  body.t3::after { opacity:.5; }
  body.t4::after { opacity:.9; }
  body.dark::after { opacity:0; }

  #term { width:100%; height:100vh; height:100dvh; display:flex; flex-direction:column; background:var(--panel);
    border:1px solid var(--line); overflow:hidden; transition: border-color 1.6s, background 1.6s; }
  
  body.t3 #term { border-color:#3a3a3a; }
  body.t4 #term { border-color:#4a4a4a; }
  .shake { animation: shake .25s !important; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }

  .bar { flex:none; display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line);
    font-size:12px; color:var(--dim); background:rgba(255,255,255,.02); }
  .bar .dots { display:flex; gap:6px; } .bar .dots i { width:10px; height:10px; border-radius:50%; background:#2a323a; display:block; }
  .bar .ttl { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar .st { padding:1px 7px; border:1px solid var(--dim); border-radius:3px; letter-spacing:.06em; color:var(--text); }
  body.t2 .bar .st { color:var(--warn); border-color:var(--warn); }
  body.t3 .bar .st, body.t4 .bar .st { color:var(--err); border-color:var(--err); }

  .log { flex:1; min-height:0; overflow:hidden; padding:12px 16px; font-size:clamp(12px, 3.3vw, 15px); line-height:1.55;
    display:flex; flex-direction:column; justify-content:flex-end;  }
  .log::after { content:"▌"; color:var(--bright); animation: blink 1s steps(1) infinite; flex:none; }
  @keyframes blink { 50%{ opacity:0 } }
  .ln { white-space:pre-wrap; word-break:break-all; flex:none; }
  .info { color:var(--text); } .ok { color:var(--ok); } .warn { color:var(--warn); } .err { color:var(--err); }
  .dim { color:var(--dim); }

  .prompt { flex:none; border-top:1px solid var(--line); padding:14px 16px max(16px, env(safe-area-inset-bottom)); background:rgba(255,255,255,.025); }
  .pstep { font-size:12px; color:var(--dim); margin-bottom:6px; letter-spacing:.08em; }
  body.t2 .pstep { color:var(--warn); } body.t3 .pstep, body.t4 .pstep { color:var(--err); font-weight:700; }
  body.t2 .pq { border-left-color:var(--warn); }
  .pq { white-space:pre-line; font-size:clamp(14px, 4vw, 17px); line-height:1.6; margin:0 0 12px; color:var(--bright); padding-left:10px; border-left:2px solid var(--dim); }
  body.t3 .pq, body.t4 .pq { border-left-color:var(--err); }
  .btns { display:flex; gap:10px; }
  button { flex:1; font-family:inherit; font-size:13px; padding:12px 8px; border-radius:4px; cursor:pointer;
    background:transparent; color:var(--text); border:1px solid var(--dim); }
  button.go { background:var(--bright); color:#0a0c0e; border-color:var(--bright); font-weight:700; }
  button[disabled] { opacity:.28; cursor:not-allowed; }
  button:active { transform:scale(.98); }
  .hidden { display:none !important; }

  .prog { flex:none; padding:12px 16px max(16px, env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  .prog .lbl { display:flex; justify-content:space-between; font-size:11px; color:var(--text); margin-bottom:7px; }
  .track { height:7px; background:var(--line); border-radius:2px; overflow:hidden; }
  #barfill { height:100%; width:0%; background:var(--err); }

  /* 最後のドアップ */
  #result { position:fixed; inset:0; background:#000; overflow:hidden; display:none; z-index:10; }
  #result.on { display:block; animation: hardshake .7s; }
  #result img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    object-position:50% 42%; transform-origin:50% 42%;
    animation: slam .16s ease-out forwards, creep 14s linear .16s forwards; }
  @keyframes slam { from{ transform:scale(.25); opacity:0 } to{ transform:scale(1.35); opacity:1 } }
  @keyframes creep { from{ transform:scale(1.35) } to{ transform:scale(1.9) } }
  @keyframes hardshake {
    0%,100%{transform:translate(0,0)} 10%{transform:translate(-14px,8px)} 20%{transform:translate(12px,-10px)}
    30%{transform:translate(-10px,-6px)} 40%{transform:translate(10px,10px)} 50%{transform:translate(-8px,4px)}
    60%{transform:translate(6px,-6px)} 70%{transform:translate(-4px,4px)} 85%{transform:translate(3px,-2px)}
  }
  #flashov { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #result.on #flashov { animation: flashout .5s ease-out; }
  @keyframes flashout { from{opacity:1} to{opacity:0} }
  #again { position:absolute; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); transform:translateX(-50%);
    flex:none; padding:8px 16px; font-size:13px; background:rgba(0,0,0,.35); color:#fff; border:0; opacity:.28; border-radius:999px; }
</style>
</head>

<script>
  /* ---------- 音(Web Audio。外部ファイル不要) ---------- */
  let ac = null, master = null;

  function initAudio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      const comp = ac.createDynamicsCompressor();
      master = ac.createGain();
      master.gain.value = 0.85;
      master.connect(comp); comp.connect(ac.destination);
    }
    if (ac.state === "suspended") ac.resume();
  }
  function tone(freq, dur, type, vol, when, slideTo) {
    if (!ac) return;
    const t = ac.currentTime + (when || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noiseBuf(sec, power) {
    const b = ac.createBuffer(1, Math.floor(ac.sampleRate * sec), ac.sampleRate);
    const d = b.getChannelData(0);
    for (let k = 0; k < d.length; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / d.length, power);
    return b;
  }
  function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

  /* サイレンなし。実際の感染PCは「ほぼ無音」で、冷却ファンが唸り出し、
     ディスクが激しく読み書きする音だけが変わる。それを再現する。 */
  const AMB_GAP = [0, 0, 2600, 1300, 600, 260];          // ディスク音の間隔(ms)
  const FAN_VOL = [0, 0.004, 0.012, 0.024, 0.04, 0.06];   // ファン音量
  const FAN_HZ  = [0, 300, 380, 520, 700, 950];           // ファンの帯域(回転数)
  let amb = null;
  function click(vol, freq) {            // キーボード/ディスクの短いクリック
    if (!ac) return;
    const s = ac.createBufferSource(); s.buffer = noiseBuf(0.02, 5);
    const bp = ac.createBiquadFilter(); bp.type = "bandpass";
    bp.frequency.value = freq || (1500 + Math.random() * 1500); bp.Q.value = 0.9;
    const g = ac.createGain(); g.gain.value = vol;
    s.connect(bp); bp.connect(g); g.connect(master); s.start();
  }
  function seek(level) {                 // HDDのシーク: コツッ + 軽い共鳴
    if (!ac) return;
    const v = 0.04 + level * 0.012;
    click(v, 900 + Math.random() * 700);
    tone(130 + Math.random() * 40, 0.04, "sine", v * 0.8);
  }
  function ambientEvent(level) {
    if (level < 2) return;
    const n = 1 + Math.floor(Math.random() * (level >= 4 ? 7 : 3));   // 連続アクセス
    for (let k = 0; k < n; k++) setTimeout(() => seek(level), k * (35 + Math.random() * 70));
  }
  function setSiren(level) {             // 名前はそのまま、中身は環境音
    if (!ac || level <= 0) return;
    level = Math.min(level, 5);
    const t = ac.currentTime;
    if (!amb) {
      const src = ac.createBufferSource(); src.buffer = noiseBuf(3, 0); src.loop = true;
      const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.7;
      bp.frequency.value = FAN_HZ[level];
      const wob = ac.createOscillator(); wob.frequency.value = 0.35;   // 回転の揺らぎ
      const wg = ac.createGain(); wg.gain.value = 40;
      wob.connect(wg); wg.connect(bp.frequency);
      const g = ac.createGain(); g.gain.value = 0.0001;
      src.connect(bp); bp.connect(g); g.connect(master); src.start(); wob.start();
      amb = { src, wob, bp, g, level, timer: null };
      const loop = () => {
        if (!amb) return;
        ambientEvent(amb.level);
        amb.timer = setTimeout(loop, (AMB_GAP[amb.level] || 3000) * (0.4 + Math.random() * 1.2));
      };
      loop();
    }
    amb.level = level;
    const ramp = (p, v) => { p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); p.linearRampToValueAtTime(v, t + 3); };
    ramp(amb.g.gain, FAN_VOL[level]);      // ファンがゆっくり回転数を上げる
    ramp(amb.bp.frequency, FAN_HZ[level]);
  }
  function stopSiren() {
    if (!amb || !ac) return;
    const t = ac.currentTime, s = amb;
    clearTimeout(s.timer);
    s.g.gain.cancelScheduledValues(t);
    s.g.gain.setValueAtTime(s.g.gain.value, t);
    s.g.gain.linearRampToValueAtTime(0.0001, t + 0.05);
    s.src.stop(t + 0.12); s.wob.stop(t + 0.12);
    amb = null;
  }
  function dialogDing(level) {           // OSのダイアログ通知音っぽい控えめな音
    if (!ac) return;
    const f = level >= 2 ? 440 : 660;
    tone(f, 0.5, "sine", 0.05);
    tone(f * 2.01, 0.3, "sine", 0.015);
  }
  function explosion() {         // 重く巨大な爆発: 衝撃 → 爆風 → 超低音 → 長い地鳴り → 瓦礫
    if (!ac) return;
    const t = ac.currentTime;
    const curve = new Float32Array(512);
    for (let k = 0; k < 512; k++) { const x = k / 256 - 1; curve[k] = Math.tanh(x * 3); }
    const dist = ac.createWaveShaper(); dist.curve = curve;
    const big = ac.createGain(); big.gain.value = 1.6;
    dist.connect(big); big.connect(master);
    const noise = (sec, pw, type, f0, f1, ft, vol, dest) => {
      const s = ac.createBufferSource(); s.buffer = noiseBuf(sec, pw);
      const fl = ac.createBiquadFilter(); fl.type = type;
      fl.frequency.setValueAtTime(f0, t);
      fl.frequency.exponentialRampToValueAtTime(f1, t + ft);
      const g = ac.createGain(); g.gain.value = vol;
      s.connect(fl); fl.connect(g); g.connect(dest || dist); s.start(t);
    };
    noise(0.35, 3, "highpass", 600, 600, 0.3, 1.2);              // 破裂の衝撃
    noise(4.5, 1.4, "lowpass", 9000, 70, 3.2, 1.6);              // 巨大な爆風
    noise(7.0, 0.8, "lowpass", 220, 40, 6.5, 1.3);               // 長く尾を引く地鳴り
    tone(70, 3.5, "sine", 1.6, 0, 18);                           // 腹に響く超低音
    tone(42, 5.0, "sine", 1.5, 0.02, 16);
    tone(110, 2.0, "triangle", 1.0, 0, 28);
    setTimeout(() => {                                           // 遅れてくる二度目の衝撃波
      if (!ac) return;
      const t2 = ac.currentTime;
      tone(55, 2.5, "sine", 1.2, 0, 20);
      const s2 = ac.createBufferSource(); s2.buffer = noiseBuf(2.5, 1.5);
      const l2 = ac.createBiquadFilter(); l2.type = "lowpass"; l2.frequency.setValueAtTime(1500, t2);
      l2.frequency.exponentialRampToValueAtTime(60, t2 + 2); 
      const g2 = ac.createGain(); g2.gain.value = 0.9;
      s2.connect(l2); l2.connect(g2); g2.connect(dist); s2.start(t2);
    }, 700);
  }

  /* ---------- 画面の流れ ---------- */
  const $ = id => document.getElementById(id);
  const wait = ms => new Promise(r => setTimeout(r, ms));

  const steps = [

              ["info", "[   0.231] open request  IMG_4800.jpg  size=213127  sha256=9f2c41…e07a"],
              ["info", "[   0.232] policy: restricted-media -> operator confirmation required"]],
      q: "このファイルは保護されたメディアです。\nアクセスするには管理者の確認が必要です。",
      yes: "続行", no: "キャンセル", noDis: false, st: "IDLE" },
    { lines: [["warn", "[   1.870] warn   origin not verified (unsigned)"],
              ["warn", "[   1.871] warn   sandbox disabled by request"],
              ["warn", "[   1.902] warn   supervisor heartbeat missed (3000ms)"]],
      q: "【警告】送信元の署名を検証できません。\n信頼できない送信元のデータを開くと、システムに重大な損害を与える可能性があります。続行しますか?",
      yes: "続行", no: "キャンセル", noDis: false, st: "WARN" },
    { lines: [["err",  "[   4.118] error  supervisor unreachable"],
              ["err",  "[   4.119] error  abort handler: ERR_NO_HANDLER (0x80070057)"],
              ["err",  "[   4.119] error  cancel is disabled by policy"]],
      q: "【エラー 0x80070057】管理プロセスに接続できません。\n中止処理が応答しないため、キャンセルは無効化されました。",
      yes: "続行", no: "キャンセル", noDis: true, st: "FAULT" },
    { lines: [["err",  "[   6.402] auth   token mismatch (expected 5d1a…, got 0000…)"],
              ["err",  "[   6.403] auth   fallback: override=true"],
              ["err",  "[   6.455] net    inbound session 198.51.100.23:443 (tls1.3)"],
              ["err",  "[   6.456] net    session accepted"]],
      q: "【重大】未承認のリモートセッション(198.51.100.23)が接続され、管理者権限を取得しました。\nこのセッションは終了できません。",
      yes: "続行", no: "キャンセル", noDis: true, st: "FAULT" },
    { lines: [["info", "[   8.931] render  pipeline ready"],
              ["err",  "[   8.932] render  waiting for operator"],
              ["err",  "[   8.932] note    this action cannot be reverted"]],
      q: "【最終警告】この操作は取り消せません。\n実行するとデータが完全に破損するおそれがあります。本当に表示しますか?",
      yes: "表示する", no: "キャンセル", noDis: true, st: "CRITICAL" }
  ];

  let tk = 0, i = 0, flood = false;
  /* 待ち時間もログが流れ続ける(段階が進むほど異常な行が増える) */
  const CH_OK = [
    "  vaultd[2291]: gc sweep: 14 objs freed",
    "  vaultd[2291]: heartbeat ok (rtt=0.4ms)",
    "  kernel: EXT4-fs (sda2): re-mounted. Opts: discard",
    "  systemd[1]: Started Session c42 of user root.",
    "  cron[611]: (root) CMD (/usr/lib/vaultd/rotate)",
    "  vaultd[2291]: keyring: cache hit 3/3"
  ];
  const CH_WARN = [
    "  vaultd[2291]: WARN slow io: 1840ms (sda2)",
    "  kernel: nf_conntrack: table full, dropping packet",
    "  vaultd[2291]: WARN checksum mismatch blk=0x" ,
    "  sshd[884]: Failed none for invalid user from 198.51.100.23 port 51822"
  ];
  const CH_ERR = [
    "  kernel: blk_update_request: I/O error, dev sda, sector ",
    "  kernel: general protection fault, ip:0x",
    "  vaultd[2291]: ERROR write failed: EIO",
    "  kernel: Out of memory: Killed process 2291 (vaultd)",
    "  kernel: segfault at 0000000000000000 ip 00007f"
  ];
  setInterval(() => {
    if (flood || i < 1 || document.body.className === "dark" || $("result").classList.contains("on")) return;
    const lv = Math.min(i, 4), r = Math.random();
    let line, cls;
    if (r < 0.55 - lv * 0.1) { line = CH_OK[Math.floor(Math.random() * CH_OK.length)]; cls = "dim"; }
    else if (r < 0.85 - lv * 0.05 && lv < 3) { line = CH_WARN[Math.floor(Math.random() * CH_WARN.length)]; cls = "warn"; if (line.endsWith("0x")) line += hex(4); }
    else { line = CH_ERR[Math.floor(Math.random() * CH_ERR.length)]; cls = "err"; if (/sector $|0x$|ip 00007f$/.test(line)) line += hex(/sector/.test(line) ? 5 : 8); }
    addLine(cls, line);
  }, 650);

  function setLevel() { document.body.className = i > 0 ? "t" + Math.min(i, 4) : ""; }
  function shake() {
    const c = $("term");
    c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
  }
  function scrollLog() { const l = $("log"); l.scrollTop = l.scrollHeight; }
  function addLine(cls, text) {
    const d = document.createElement("div");
    d.className = "ln " + cls;
    d.textContent = text;
    const l = $("log");
    l.appendChild(d);
    while (l.children.length > 80) l.removeChild(l.firstChild);
    scrollLog();
  }
  const hex = n => Math.floor(Math.random() * Math.pow(16, n)).toString(16).padStart(n, "0");

  async function runStep() {
    const my = tk, s = steps[i];
    setLevel(); setSiren(i);
    $("st").textContent = s.st;
    $("prompt").classList.add("hidden");
    for (const [cls, text] of s.lines) {
      addLine(cls, text);
      await wait(120 + Math.random() * 160);
      if (my !== tk) return;
    }
    await wait(300);
    if (my !== tk) return;
    $("pstep").textContent = `${["確認","セキュリティ警告","システムエラー","重大な警告","最終警告"][i]}  ${i + 1} / ${steps.length}`;
    $("pq").textContent = s.q;
    $("yes").textContent = s.yes;
    $("no").textContent = s.no;
    $("no").disabled = s.noDis;
    $("prompt").classList.remove("hidden");
    dialogDing(i);
  }

  async function finalPhase() {
    const my = tk;
    document.body.className = "t4"; setSiren(5);
    $("st").textContent = "CRITICAL";
    addLine("err", "[   9.870] render  start");
    $("prog").classList.remove("hidden");
    let p = 0;
    while (p < 100) {
      if (my !== tk) return;
      p = Math.min(100, p + 1 + Math.random() * 3);
      $("barfill").style.width = p + "%";
      $("pct").textContent = Math.floor(p) + "%";
      if (Math.random() < 0.5) {
        addLine("dim", "0x" + hex(6) + "  " + [hex(4), hex(4), hex(4), hex(4)].join(" "));
      }
      if (Math.random() < 0.4) seek(5);
      await wait(120);
    }
    // 出力が一気に溢れる
    flood = true;
    vib(150);
    for (let k = 0; k < 70; k++) {
      if (my !== tk) return;
      const r = Math.random();
      addLine(r < 0.2 ? "err" : "dim", r < 0.2 ? "error  block 0x" + hex(5) + " write failed" : "0x" + hex(6) + "  " + [hex(4), hex(4), hex(4), hex(4)].join(" "));
      if (k % 3 === 0) seek(5);
      await wait(22);
    }
    await wait(250);
    if (my !== tk) return;
    // すべて止めて、真っ暗 + 無音の「間」
    stopSiren();
    document.body.className = "dark";
    await wait(1100);
    await wait(800);
    if (my !== tk) return;
    $("result").classList.add("on");
    explosion();
    vib([400, 60, 250]);
  }

  $("yes").onclick = () => {
    initAudio();
    click(0.12, 1800);
    $("prompt").classList.add("hidden");
    i++;
    if (i >= steps.length) finalPhase(); else runStep();
  };
  $("no").onclick = () => {
    initAudio();
    if ($("no").disabled) { dialogDing(3); shake(); return; }
    dialogDing(3);
    addLine("err", "[   " + (i * 2 + 2.1).toFixed(3) + "] error  cancel request rejected");
    shake();
  };
  $("again").onclick = () => {
    tk++; i = 0; flood = false;
    stopSiren();
    $("result").classList.remove("on");
    const img = $("result").querySelector("img");
    img.style.animation = "none"; void img.offsetWidth; img.style.animation = "";
    $("log").innerHTML = "";
    $("barfill").style.width = "0%"; $("pct").textContent = "0%";
    $("prog").classList.add("hidden");
    document.body.className = "";
    runStep();
  };
  runStep();
</script>

</body>
</html>
