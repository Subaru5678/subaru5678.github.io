<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>開眼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yuji+Boku&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --brush:"Yuji Boku","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; background:#0d0614; color:#fff; overflow:hidden; touch-action:none;
    font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; }
  canvas { display:block; width:100vw; height:100vh; height:100dvh; }
  .ov { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px; }
  .ov.hidden { display:none; }
  #start { background:radial-gradient(ellipse at 50% 38%, rgba(70,12,24,.55), rgba(8,3,14,.93) 72%); }
  .title { font-family:var(--brush); font-weight:400; font-size:clamp(120px,48vw,250px); line-height:.95; margin:0; letter-spacing:-.05em;
    background:linear-gradient(180deg,#fffbe0 0%,#ffd24a 36%,#e0840e 62%,#8c2f04 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:4px #2b0900; paint-order:stroke fill;
    filter:drop-shadow(0 7px 0 #150400) drop-shadow(0 0 34px rgba(255,150,30,.6)); transform:rotate(-2deg); animation:breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 50% { filter:drop-shadow(0 7px 0 #150400) drop-shadow(0 0 54px rgba(255,190,60,.95)); } }
  .sub { font-family:var(--brush); font-size:clamp(14px,4.2vw,21px); letter-spacing:.7em; color:#e9c46a; margin:0 0 4px .7em; }
  .seal { position:absolute; top:max(18px,env(safe-area-inset-top)); right:18px; width:60px; height:60px; background:#c1121f; color:#fff2e0;
    font-family:var(--brush); font-size:32px; display:flex; align-items:center; justify-content:center; border-radius:6px; transform:rotate(6deg);
    box-shadow:0 0 0 3px #7a0a12 inset; }
  .rules { display:grid; grid-template-columns:auto 1fr; gap:8px 12px; text-align:left; max-width:22em; font-size:clamp(13px,3.7vw,16px); line-height:1.5; color:#f1e6d0;
    background:rgba(0,0,0,.35); border:1px solid rgba(244,213,141,.35); border-radius:8px; padding:12px 16px; }
  .rules b { font-size:1.4em; line-height:1; text-align:center; }
  button { font-family:var(--brush); font-size:28px; padding:12px 52px; border:0; border-radius:6px; cursor:pointer; letter-spacing:.3em;
    background:#c1121f; color:#fff2e0; box-shadow:0 0 0 3px #f4d58d inset, 0 6px 0 #5a0a10; }
  button:active { transform:translateY(3px); box-shadow:0 0 0 3px #f4d58d inset, 0 3px 0 #5a0a10; }
  #over { justify-content:flex-end; padding-bottom:max(30px,env(safe-area-inset-bottom)); pointer-events:none; }
  #over > * { pointer-events:auto; }
  #res { font-family:var(--brush); font-size:clamp(20px,6vw,28px); color:#fff2c4; text-shadow:0 2px 0 #000, 0 0 14px #000; line-height:1.5; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ov" id="start">
  <div class="seal">眼</div>
  <h1 class="title">開眼</h1>
  <div class="sub">KAIGAN</div>
  <div class="rules">
    <b>🥤</b><span>エナジードリンクを取るとゲージが上がり、目が開いていく</span>
    <b>💤</b><span>眠気に当たるとゲージ大幅ダウン</span>
    <b>🌀</b><span>ゲージが満ちると、チャクラが開く</span>
  </div>
  <button id="go">始 め</button>
</div>
<div class="ov hidden" id="over">
  <p id="res" style="margin:0"></p>
  <button id="again">もう一度</button>
</div>

const cv = $("c"), cx = cv.getContext("2d");
let W, H, DPR, bg = null;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0); bg = null;
}
addEventListener("resize", resize); resize();
const FACE_R = () => Math.min(W * .225, H * .13);       // 顔は最初からデカい(ゲーム中ずっと同じ大きさ)
const U      = () => Math.min(W, H) / 430;            // 体のパーツの基準
const GROUND = () => H - 20;
const FACE_Y = () => GROUND() - 98 * U() - FACE_R() * .78;

/* ================= 音 ================= */
let ac = null, nbuf = null, master = null;
function audioInit() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    const comp = ac.createDynamicsCompressor(); master = ac.createGain(); master.gain.value = .9; master.connect(comp); comp.connect(ac.destination); }
  if (ac.state === "suspended") ac.resume();
}
function noise() {
  if (!nbuf) { nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = nbuf.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = Math.random() * 2 - 1; }
  return nbuf;
}
function snd(f, d, type, v, slide, when) {
  if (!ac) return;
  const t = ac.currentTime + (when || 0), o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v || .08, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .03);
}
function hiss(d, v, f, type) {
  if (!ac) return;
  const t = ac.currentTime, s = ac.createBufferSource(); s.buffer = noise();
  const fl = ac.createBiquadFilter(); fl.type = type || "highpass"; fl.frequency.value = f || 3500;
  const g = ac.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + d);
}
/* 都節音階(和風): D E♭ G A B♭ */
const MIYAKO = [293.7, 311.1, 392, 440, 466.2, 587.3, 622.3, 784, 880, 932.3];
function koto(i, when, vol) {                       // 琴っぽい撥弦音
  const f = MIYAKO[Math.max(0, Math.min(MIYAKO.length - 1, i))];
  snd(f * 1.03, .06, "sawtooth", (vol || .07) * .6, f, when);
  snd(f, 1.1, "triangle", vol || .09, f * .995, when); snd(f * 2, .5, "sine", (vol || .09) * .35, null, when);
}
function taiko(when, v) { snd(120, .5, "sine", v || .6, 45, when); hiss(.18, (v || .6) * .5, 400, "lowpass"); }
const sCan  = i => { hiss(.22, .22); snd(170, .09, "triangle", .2, 85, .1); snd(150, .09, "triangle", .2, 75, .2); koto(i, .05); };
const sGold = () => { hiss(.3, .3); [0, 2, 4, 6, 8].forEach((k, n) => koto(k + 2, n * .07, .07)); };
const sBad  = () => { snd(190, .5, "sawtooth", .12, 50); snd(130, .7, "sine", .3, 40, .05); [330, 294, 247].forEach((f, k) => snd(f, .3, "triangle", .08, f * .75, .1 + k * .2)); };
const sMiss = () => snd(220, .22, "triangle", .07, 110);
const sOpen1 = () => { koto(5, 0, .1); koto(7, .08, .1); };
const sOpen2 = () => {                                // 「カッ!!」: 太鼓 + 鋭い打撃 + 上昇する倍音
  taiko(0, .9); hiss(.12, .5, 1500); snd(70, 1.4, "sine", .6, 35);
  [587, 784, 1175, 1568].forEach((f, k) => snd(f, 1.6, "sine", .05, f * 1.02, .05 + k * .03));
};
function sWin() {
  [[55, 1], [110, .8], [165, .5], [247, .35], [331, .25]].forEach(([f, v]) => snd(f * (1 + Math.random() * .004), 7, "sine", v * .38, f * .985));
  hiss(.9, .12, 900); taiko(0, .8);
  [0, 1, 3, 5, 6, 8, 9].forEach((k, n) => koto(k, .9 + n * .42, .1));    // 7つのチャクラが灯る旋律
  [136.1, 204].forEach(f => snd(f, 9, "triangle", .06, f, 2.4));
}
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

/* ================= 状態 ================= */
const A = .3, B = .75;                                 // 目が(閉→普通→見開き)に切り替わるゲージ位置
let st = "start", px, tx, gauge, items, spawnT, t0, shake, nod, lid, alpha, stage, floaters, zzz, bursts;
let walk = 0, vxs = 0, winT = 0, winTime = 0, drinkPop = 0, flash = 0, hitstop = 0, kaT = 0, blinkT = 0, nextBlink = 3;
const stageOf = g => g >= B ? 2 : g >= A ? 1 : 0;

function reset() {
  px = tx = W / 2; gauge = .1; items = []; spawnT = .5; t0 = performance.now(); shake = 0; nod = 0; lid = .3;
  alpha = [1, 0, 0]; stage = stageOf(gauge); floaters = []; zzz = []; bursts = []; winT = 0; drinkPop = 0; flash = 0; hitstop = 0; kaT = 0;
  st = "play";
}
function setGauge(v) {
  const old = stageOf(gauge); gauge = Math.max(0, Math.min(1, v)); const ns = stageOf(gauge);
  if (ns > old) {
    if (ns === 1) { sOpen1(); flash = .25; }
    if (ns === 2) { sOpen2(); flash = 1; hitstop = .12; kaT = 1.1; shake = .6; vib([30, 40, 60]); }
  }
  stage = ns;
  if (gauge >= 1 && st === "play") win();
}
function win() {
  st = "win"; winT = 0; winTime = (performance.now() - t0) / 1000; items = []; stage = 2; sWin(); vib([80, 60, 200]);
  setTimeout(() => {
    $("res").innerHTML = `到達 ${winTime.toFixed(1)} 秒`;
    $("over").classList.remove("hidden");
  }, 6500);
}
function spawn() {
  const el = (performance.now() - t0) / 1000, r = Math.random();
  const kind = r < .32 ? "bad" : r > .94 ? "gold" : "can";
  const s = Math.min(W, H) * .085;
  items.push({ kind, x: s + Math.random() * (W - s * 2), y: -s, s, vy: (H * .27 + Math.min(el, 70) * 3.2) * (.85 + Math.random() * .4),
    rot: (Math.random() - .5) * .8, vr: (Math.random() - .5) * 2.4, e: ["🛏️", "💤", "🌙", "📖"][Math.floor(Math.random() * 4)] });
}
const pop = (text, x, y, color) => floaters.push({ text, x, y, life: 1, color });

/* ================= 更新 ================= */
let last = performance.now();

  if (st === "win") { winT += dt; return; }

  const el = (performance.now() - t0) / 1000;
  setGauge(gauge - dt * (.01 + Math.min(.012, el / 5000)));          // 眠気でじわじわ下がる
  if (st !== "play") return;
  spawnT -= dt; if (spawnT <= 0) { spawn(); spawnT = Math.max(.34, .78 - el * .007) * (.7 + Math.random() * .6); }
  const r = FACE_R(), fy = FACE_Y();
  for (const it of items) {
    it.y += it.vy * dt; it.rot += it.vr * dt;
    const dx = it.x - px, dy = it.y - fy;
    if (!it.dead && dx * dx + dy * dy < (r * .95 + it.s * .4) ** 2) {
      it.dead = true;
      if (it.kind === "bad") {
        setGauge(gauge - .3); shake = .6; nod = .8; sBad(); vib(120); pop("眠気に負けた… -30%", it.x, it.y, "#9ec5ff");
        for (let k = 0; k < 3; k++) zzz.push({ x: px + r * .7 + k * 16, y: fy - r * .6 - k * 22, life: 1.3 + k * .2, s: 22 + k * 10 });
      } else if (it.kind === "gold") {
        setGauge(gauge + .15); drinkPop = .4; sGold(); vib(30); pop("黄金のエナジー!! +15%", it.x, it.y, "#ffd84a");
        for (let k = 0; k < 14; k++) bursts.push({ x: it.x, y: it.y, vx: (Math.random() - .5) * 420, vy: -Math.random() * 300, life: 1, c: "#ffd84a" });
      } else {
        setGauge(gauge + .05); drinkPop = .25; sCan(Math.floor(gauge * 9)); pop("+5%", it.x, it.y, "#fff");
        for (let k = 0; k < 6; k++) bursts.push({ x: it.x, y: it.y, vx: (Math.random() - .5) * 260, vy: -Math.random() * 200, life: 1, c: "#7fd0ff" });
      }
    } else if (it.y > H + it.s && !it.dead) {
      it.dead = true;
      if (it.kind !== "bad") { setGauge(gauge - .07); sMiss(); pop("取り逃し -7%", it.x, H - 56, "#ff9e9e"); }
    }
  }
  items = items.filter(i => !i.dead && i.y < H + 100);
}

/* ================= 描画 ================= */
function makeBg() {
  bg = document.createElement("canvas"); bg.width = W * DPR; bg.height = H * DPR;
  const b = bg.getContext("2d"); b.scale(DPR, DPR);
  const g = b.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#150a28"); g.addColorStop(.6, "#38102e"); g.addColorStop(1, "#6a1c1c");
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  const r = Math.max(26, W / 9); b.lineWidth = 1.4;           // 青海波
  for (let row = 0, y = H * .12; y < H + r; row++, y += r * .5)
    for (let x = (row % 2 ? r : 0) - r; x < W + r; x += r * 2)
      for (let k = 3; k >= 1; k--) { b.strokeStyle = `rgba(244,213,141,${.05 + k * .018})`; b.beginPath(); b.arc(x, y, r * k / 3, Math.PI, 0); b.stroke(); }
  // 朱色の柱と鴨居
  for (const x of [0, W - 14]) { const pg = b.createLinearGradient(x, 0, x + 14, 0); pg.addColorStop(0, "#5a0d10"); pg.addColorStop(.5, "#b3202a"); pg.addColorStop(1, "#5a0d10"); b.fillStyle = pg; b.fillRect(x, 0, 14, H); }
}
function limb(x1, y1, x2, y2, w, col) {
  cx.lineCap = "round";
  cx.strokeStyle = "#111"; cx.lineWidth = w + 4; cx.beginPath(); cx.moveTo(x1, y1); cx.lineTo(x2, y2); cx.stroke();
  cx.strokeStyle = col; cx.lineWidth = w; cx.beginPath(); cx.moveTo(x1, y1); cx.lineTo(x2, y2); cx.stroke();
}
const CHAKRA = ["#e63946", "#f77f00", "#ffd60a", "#2dc653", "#3a86ff", "#4f46e5", "#b517e0"];
function lotus(x, y, r, col, spin, petals) {
  cx.save(); cx.translate(x, y); cx.rotate(spin); cx.shadowColor = col; cx.shadowBlur = r * 1.6;
  cx.fillStyle = col + "55"; cx.beginPath(); cx.arc(0, 0, r * 1.25, 0, 7); cx.fill(); cx.fillStyle = col;
  for (let k = 0; k < petals; k++) { cx.rotate(Math.PI * 2 / petals); cx.beginPath(); cx.ellipse(0, -r * .78, r * .2, r * .42, 0, 0, 7); cx.fill(); }
  cx.shadowBlur = 0; cx.fillStyle = "#fff"; cx.beginPath(); cx.arc(0, 0, r * .3, 0, 7); cx.fill();
  cx.strokeStyle = "#fff"; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(0, 0, r * .55, 0, 7); cx.stroke(); cx.restore();
}
function drawBody(r, u, t, zen) {
  const y0 = r * .78, tw = 25 * u, th = 54 * u, ll = 44 * u, run = Math.min(1, Math.abs(vxs) / 250);
  for (const s of [-1, 1]) {
    const hx = s * 11 * u, hy = y0 + th - 4 * u; let fx, fy2;
    if (zen) { fx = -s * 18 * u; fy2 = hy + ll * .3; }
    else { const ph = walk * 2.2 + (s > 0 ? Math.PI : 0); fx = hx + Math.sin(ph) * 22 * u * run; fy2 = hy + ll - Math.max(0, Math.cos(ph)) * 10 * u * run; }
    limb(hx, hy, fx, fy2, 11 * u, "#262a3d");
    cx.fillStyle = "#f2f2f2"; cx.strokeStyle = "#111"; cx.lineWidth = 2; cx.beginPath(); cx.ellipse(fx, fy2 + 3 * u, 13 * u, 6.5 * u, 0, 0, 7); cx.fill(); cx.stroke();
  }
  cx.fillStyle = "#f4f6f4"; cx.strokeStyle = "#111"; cx.lineWidth = 3; cx.beginPath(); cx.roundRect(-tw, y0, tw * 2, th, 10 * u); cx.fill(); cx.stroke();
  cx.fillStyle = "#1b2030"; cx.beginPath(); cx.moveTo(-5 * u, y0 + 2); cx.lineTo(5 * u, y0 + 2); cx.lineTo(7 * u, y0 + th * .75); cx.lineTo(0, y0 + th * .95); cx.lineTo(-7 * u, y0 + th * .75); cx.closePath(); cx.fill();
  cx.strokeStyle = "#cfd4dc"; cx.lineWidth = 1.5;
  for (let k = 1; k < 5; k++) { const yy = y0 + k * th * .16; cx.beginPath(); cx.moveTo(-5 * u, yy); cx.lineTo(5 * u, yy - 4 * u); cx.stroke(); }
  for (const s of [-1, 1]) {
    const shx = s * (tw - 2 * u), shy = y0 + 9 * u, al = 40 * u; let hx, hy;
    if (zen) { hx = s * 10 * u; hy = shy + 36 * u; }
    else if (nod > 0) { hx = shx + s * 8 * u; hy = shy + al; }
    else if (drinkPop > 0) { const a = -Math.PI / 2 + s * (.35 + Math.sin(t * 25) * .12); hx = shx + Math.cos(a) * al; hy = shy + Math.sin(a) * al; }
    else { const a = Math.PI / 2 - s * (.25 + Math.sin(walk * 2.2 + (s > 0 ? 0 : Math.PI)) * .9 * run); hx = shx + Math.cos(a) * al; hy = shy + Math.sin(a) * al; }
    limb(shx, shy, hx, hy, 9 * u, "#f4f6f4");
    cx.fillStyle = "#f0c9a2"; cx.strokeStyle = "#111"; cx.lineWidth = 2; cx.beginPath(); cx.arc(hx, hy, 7 * u, 0, 7); cx.fill(); cx.stroke();
  }
  cx.fillStyle = "#f0c9a2"; cx.fillRect(-8 * u, y0 - 6 * u, 16 * u, 12 * u);
}
function drawFace(r) {
  cx.save(); cx.beginPath(); cx.arc(0, 0, r, 0, 7); cx.closePath(); cx.fillStyle = "#222"; cx.fill(); cx.clip();
  for (let k = 0; k < 3; k++) { if (k > 0 && alpha[k] < .01) continue; cx.globalAlpha = k === 0 ? 1 : Math.min(1, alpha[k]); if (IMG[k].complete) cx.drawImage(IMG[k], -r, -r, r * 2, r * 2); }
  cx.globalAlpha = 1; cx.restore();
}
function drawCan(it) {
  const s = it.s, w = s * .95, h = s * 1.75, gold = it.kind === "gold";
  cx.save(); cx.translate(it.x, it.y); cx.rotate(it.rot);
  if (gold) { cx.shadowColor = "#ffd84a"; cx.shadowBlur = 26; }
  const g = cx.createLinearGradient(-w / 2, 0, w / 2, 0);
  if (gold) { g.addColorStop(0, "#9a6a00"); g.addColorStop(.35, "#ffe27a"); g.addColorStop(.7, "#e0a800"); g.addColorStop(1, "#7a5200"); }
  else { g.addColorStop(0, "#0b3a8f"); g.addColorStop(.3, "#2f8cff"); g.addColorStop(.65, "#0f58c9"); g.addColorStop(1, "#082a6b"); }
  cx.fillStyle = g; cx.strokeStyle = "#0a1a33"; cx.lineWidth = 2; cx.beginPath(); cx.roundRect(-w / 2, -h / 2, w, h, w * .18); cx.fill(); cx.stroke(); cx.shadowBlur = 0;
  cx.fillStyle = "#cfd6df"; cx.fillRect(-w * .42, -h / 2 - 1, w * .84, h * .09); cx.fillRect(-w * .42, h / 2 - h * .08, w * .84, h * .09);
  cx.fillStyle = gold ? "#7a1c00" : "#ffe14a";
  cx.beginPath(); cx.moveTo(w * .1, -h * .3); cx.lineTo(-w * .28, h * .04); cx.lineTo(-w * .02, h * .04); cx.lineTo(-w * .12, h * .3); cx.lineTo(w * .3, -h * .06); cx.lineTo(w * .03, -h * .06); cx.closePath(); cx.fill();
  cx.restore();
}
function brushText(text, x, y, size, fill) {
  cx.font = `400 ${size}px ${BRUSH}`; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.lineJoin = "round";
  cx.strokeStyle = "#2a0802"; cx.lineWidth = size * .09; cx.strokeText(text, x, y); cx.fillStyle = fill; cx.fillText(text, x, y);
}
const goldGrad = (size) => { const g = cx.createLinearGradient(0, -size / 2, 0, size / 2); g.addColorStop(0, "#fff6c9"); g.addColorStop(.5, "#ffd24a"); g.addColorStop(1, "#e08a12"); return g; };
function speedLines(cy, k) {                           // 見開いた瞬間の集中線
  cx.save(); cx.translate(W / 2, cy); cx.fillStyle = `rgba(255,255,255,${.5 * k})`;
  for (let i = 0; i < 48; i++) {
    const a = i / 48 * Math.PI * 2 + (i % 2) * .02, w = .03 + (i % 3) * .015, r0 = FACE_R() * 1.15, r1 = Math.hypot(W, H);
    cx.beginPath(); cx.moveTo(Math.cos(a - w) * r0, Math.sin(a - w) * r0); cx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); cx.lineTo(Math.cos(a + w) * r0, Math.sin(a + w) * r0); cx.fill();
  }
  cx.restore();
}
function drawAura(t, cy) {
  const k = Math.min(1, winT / 1.5), g = cx.createRadialGradient(W / 2, cy, 10, W / 2, cy, H * .7);
  g.addColorStop(0, `rgba(255,240,170,${.95 * k})`); g.addColorStop(.35, `rgba(255,170,40,${.5 * k})`); g.addColorStop(1, "rgba(255,120,0,0)");
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  cx.save(); cx.translate(W / 2, cy); cx.rotate(t * .25);
  for (let i = 0; i < 24; i++) { cx.rotate(Math.PI / 12); cx.fillStyle = `rgba(255,236,160,${(i % 2 ? .1 : .2) * k})`; cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(-H * .09, -H); cx.lineTo(H * .09, -H); cx.closePath(); cx.fill(); }
  cx.restore();
  cx.save(); cx.translate(W / 2, cy); cx.strokeStyle = `rgba(255,248,210,${.7 * k})`; cx.lineWidth = 2;
  for (let n = 0; n < 3; n++) { const rr = Math.min(W, H) * (.36 + n * .13) * k; cx.save(); cx.rotate(t * (n % 2 ? -.4 : .4)); cx.setLineDash([6, 10 + n * 6]); cx.beginPath(); cx.arc(0, 0, rr, 0, 7); cx.stroke(); cx.restore(); }
  cx.restore();
}
function drawChakras(r, u, t) {
  const y0 = r * .78, th = 54 * u, ll = 44 * u;
  const pos = [y0 + th + ll * .1, y0 + th * .72, y0 + th * .45, y0 + th * .2, y0 - 4 * u, -r * .26, -r * 1.25];
  const size = [11, 11, 11, 11, 10, 0, 16];
  for (let k = 0; k < 7; k++) {
    if (k === 5) continue;
    const ap = Math.max(0, Math.min(1, (winT - .9 - [0, 1, 2, 3, 4, 5, 6][k] * .42) / .4)); if (ap <= 0) continue;
    lotus(0, pos[k], size[k] * u * ap, CHAKRA[k], t * (k % 2 ? -2.2 : 2.2) + k, 6 + k);
  }
}
function drawHUD() {
  const pad = 18, bw = W - pad * 2 - 6, by = 52, bh = 22, x0 = pad + 3;
  cx.textBaseline = "middle"; cx.textAlign = "left"; cx.lineJoin = "round";
  cx.font = `400 28px ${BRUSH}`; cx.strokeStyle = "#000"; cx.lineWidth = 5; cx.strokeText("開眼", pad, 26); cx.fillStyle = "#ffe7a3"; cx.fillText("開眼", pad, 26);
  const label = gauge >= 1 ? "開眼!" : gauge >= B ? "あと少し!" : gauge >= A ? "ぱっちり" : "眠い…";
  cx.textAlign = "right"; cx.font = "800 20px system-ui, sans-serif"; const txt = Math.round(gauge * 100) + "%  " + label;
  cx.strokeText(txt, W - pad, 26); cx.fillStyle = "#fff"; cx.fillText(txt, W - pad, 26);
  cx.fillStyle = "#000b"; cx.strokeStyle = "#c8a24a"; cx.lineWidth = 2; cx.beginPath(); cx.roundRect(x0 - 4, by - 4, bw + 8, bh + 8, 8); cx.fill(); cx.stroke();
  const g = cx.createLinearGradient(x0, 0, x0 + bw, 0); g.addColorStop(0, "#5a6bff"); g.addColorStop(.35, "#ffd84a"); g.addColorStop(.75, "#ff8a1f"); g.addColorStop(1, "#ff2e63");
  cx.fillStyle = g; cx.beginPath(); cx.roundRect(x0, by, Math.max(6, bw * gauge), bh, 6); cx.fill();
  cx.strokeStyle = "#fffa"; cx.lineWidth = 2;
  for (const m of [A, B]) { cx.beginPath(); cx.moveTo(x0 + bw * m, by - 4); cx.lineTo(x0 + bw * m, by + bh + 4); cx.stroke(); }
  cx.textAlign = "center"; cx.font = "13px system-ui, sans-serif"; cx.fillStyle = "#e9d8a6";
  cx.fillText("ぱっちり", x0 + bw * A, by + bh + 17); cx.fillText("カッ!", x0 + bw * B, by + bh + 17); cx.fillText("🌀", x0 + bw - 4, by + bh + 17);
}
function draw() {
  if (!bg) makeBg();
  cx.drawImage(bg, 0, 0, W, H);
  if (st === "start") return;
  const t = performance.now() / 1000, win_ = st === "win", r = FACE_R(), u = U(), fy = FACE_Y();
  let lift = 0;
  if (win_) lift = Math.min(1, winT / 3.5) ** .6 * H * .14 + Math.sin(t * 1.4) * 6 * u;

  cx.fillStyle = "#26090c"; cx.fillRect(0, GROUND(), W, H); cx.fillStyle = "#c89b3c"; cx.fillRect(0, GROUND(), W, 3);
  if (win_) drawAura(t, fy - lift + r * .3);
  if (kaT > 0 && !win_) speedLines(fy, Math.min(1, kaT * 1.4));

  for (const it of items) {
    if (it.kind === "bad") { cx.save(); cx.translate(it.x, it.y); cx.rotate(it.rot); cx.font = it.s * 1.5 + "px serif"; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText(it.e, 0, 0); cx.restore(); }
    else drawCan(it);
  }
  for (const b of bursts) { cx.globalAlpha = Math.max(0, b.life); cx.fillStyle = b.c; cx.beginPath(); cx.arc(b.x, b.y, 4, 0, 7); cx.fill(); }
  cx.globalAlpha = 1;

  cx.save();
  if (shake > 0) cx.translate((Math.random() - .5) * 18 * shake, (Math.random() - .5) * 12 * shake);
  const bx = win_ ? W / 2 + (px - W / 2) * Math.max(0, 1 - winT) : px;
  cx.translate(bx, fy - lift);
  let rot = Math.sin(t * 6) * .025 + Math.max(-.3, Math.min(.3, vxs / 1800));
  if (stage === 0 && !win_ && nod <= 0) rot += Math.sin(t * 1.6) * .07 + .05;                  // 眠くてゆらゆら
  if (nod > 0) rot = Math.sin(t * 9) * .12 + .24 * Math.min(1, nod * 2);
  if (win_) rot = Math.sin(t * 1.2) * .02;
  cx.rotate(rot);
  if (drinkPop > 0 && !win_) cx.scale(1 + drinkPop * .12, 1 + drinkPop * .12);
  drawBody(r, u, t, win_);
  if (win_) drawChakras(r, u, t);
  drawFace(r);
  cx.lineWidth = Math.max(5, r * .045); cx.strokeStyle = win_ ? "#fff3b0" : stage === 2 ? "#ffd84a" : stage === 1 ? "#d9b26f" : "#6a5a7a";
  cx.beginPath(); cx.arc(0, 0, r, 0, 7); cx.stroke();
  if (win_) lotus(0, -r * .24, r * .16 * Math.min(1, winT / 1.2), "#b517e0", t * 2.2, 12);       // 眉間の第三の目
  cx.restore();

  for (const z of zzz) { cx.globalAlpha = Math.min(1, z.life); cx.fillStyle = "#cfe0ff"; cx.font = `700 ${z.s}px ${BRUSH}`; cx.textAlign = "center"; cx.fillText("Z", z.x, z.y); }
  cx.globalAlpha = 1; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.font = "800 22px system-ui, sans-serif";
  for (const f of floaters) { cx.globalAlpha = Math.max(0, f.life); cx.fillStyle = f.color; cx.strokeStyle = "#000a"; cx.lineWidth = 4; cx.strokeText(f.text, f.x, f.y); cx.fillText(f.text, f.x, f.y); }
  cx.globalAlpha = 1;

  if (!win_) {                                         // まぶた: ゲージが低いほど視界が狭い
    const hh0 = lid * H * .15;
    for (const top of [true, false]) {
      const hh = top ? hh0 : hh0 * .4, y = top ? 0 : H, dir = top ? 1 : -1, g = cx.createLinearGradient(0, y, 0, y + dir * hh);
      g.addColorStop(0, "rgba(6,2,12,.97)"); g.addColorStop(.8, "rgba(6,2,12,.9)"); g.addColorStop(1, "rgba(6,2,12,0)");
      cx.fillStyle = g; cx.fillRect(0, top ? 0 : H - hh, W, hh);
    }
  }
  drawHUD();
  if (kaT > 0 && !win_) {                              // 「カッ!!」
    const k = Math.min(1, (1.1 - kaT) / .12), s = 1.8 - .8 * k, size = Math.min(W * .27, 130);
    cx.save(); cx.globalAlpha = Math.min(1, kaT * 2); cx.translate(W / 2, H * .3); cx.scale(s, s); cx.rotate(-.08);
    cx.shadowColor = "#fff"; cx.shadowBlur = 40; brushText("カッ!!", 0, 0, size, goldGrad(size)); cx.restore();
  }
  if (win_) {
    const k = Math.min(1, Math.max(0, (winT - 4.4) / .6)), s = 1 + (1 - k) * 2.2, size = Math.min(W * .125, 80);
    cx.save(); cx.globalAlpha = k; cx.translate(W / 2, H * .2); cx.scale(s, s); cx.rotate(-.04); cx.shadowColor = "#ff9d1e"; cx.shadowBlur = 30;
    brushText("チャクラ解放", 0, 0, size, goldGrad(size)); cx.restore();
  }
  if (flash > 0 || (win_ && winT < .8)) { cx.fillStyle = `rgba(255,255,255,${win_ ? Math.max(0, 1 - winT / .8) : flash * .85})`; cx.fillRect(0, 0, W, H); }
}

/* ================= 操作 ================= */
function move(x) { const r = FACE_R(); tx = Math.max(r * .6, Math.min(W - r * .6, x)); }
addEventListener("pointerdown", e => { if (st === "play") move(e.clientX); });
addEventListener("pointermove", e => { if (st === "play") move(e.clientX); });
addEventListener("keydown", e => { if (st !== "play") return; if (e.key === "ArrowLeft") move(tx - 80); if (e.key === "ArrowRight") move(tx + 80); });
function begin() {
  audioInit(); taiko(0, .5);
  $("start").classList.add("hidden"); $("over").classList.add("hidden");
  reset();
}
$("go").onclick = begin; $("again").onclick = begin;
px = tx = W / 2; gauge = .1; items = []; floaters = []; zzz = []; bursts = []; alpha = [1, 0, 0]; stage = 0; nod = 0; shake = 0; lid = 0;
if (document.fonts && document.fonts.load) document.fonts.load('40px "Yuji Boku"', "開眼チャクラ解放カッ");
requestAnimationFrame(frame);
</script>
